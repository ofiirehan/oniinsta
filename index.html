<style>
* {

  padding: 0;
  box-sizing: border-box;

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family: Arial, Helvetica, sans-serif;
}

/* LOADING SCREEN */
#loader {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 45%,
      #171717 0%,
      #090909 42%,
      #020202 100%
    );

  color: #fff;
  z-index: 10;
}

.loading-card {
  width: min(88vw, 430px);
  text-align: center;
}

/* SPINNER */
.logo {
  width: 64px;
  height: 64px;

  margin: 0 auto 28px;

  border: 2px solid rgba(255,255,255,.12);
  border-top-color: #fff;
  border-right-color: rgba(255,255,255,.55);

  border-radius: 50%;

  animation: spin 1s linear infinite;

  box-shadow:
    0 0 30px rgba(255,255,255,.08);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* TITLE */
.title {
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;

  color: #f2f2f2;

  margin-bottom: 18px;
}

/* PROGRESS BAR */
.track {
  width: 100%;
  height: 5px;

  background: rgba(255,255,255,.10);

  border-radius: 20px;

  overflow: hidden;

  box-shadow:
    inset 0 0 8px rgba(0,0,0,.8);
}

.bar {
  width: 0%;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #fff,
      #bdbdbd
    );

  box-shadow:
    0 0 14px rgba(255,255,255,.35);

  transition: width .05s linear;
}

/* STATUS */
.status {
  height: 18px;

  margin-top: 15px;

  font-size: 11px;
  letter-spacing: 2px;

  color: rgba(255,255,255,.45);

  text-transform: uppercase;
}


/* IMAGE SCREEN */
#imageScreen {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  background: #000;
}

#imageScreen img {
  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  display: block;
}
</style>
</head>

<!-- LOADING -->

    <div class="logo"></div>

      Initializing
    </div>

    <div class="track">
      <div
        class="bar"
        id="bar">
      </div>
    </div>

    <div
      class="status"
      id="status">
      Preparing
    </div>

  </div>

</div>


<!-- IMAGE -->

</div>


<script>

const bar =
  document.getElementById("bar");

const status =
  document.getElementById("status");

const loader =
  document.getElementById("loader");

const imageScreen =
  document.getElementById("imageScreen");


function setProgress(value) {

  bar.style.width =
    value + "%";

}


function finish() {

  setProgress(100);

  status.textContent =
    "Ready";


  setTimeout(() => {

    loader.style.display =
      "none";

    imageScreen.style.display =
      "flex";

  }, 450);

}


/*
  LOADING SEQUENCE

  0% → 55% = slowly
  55% → 90% = instant jump
  90% → 100% = slowly
*/


let progress = 0;


const firstStage =
  setInterval(() => {

    progress += 1;


    if (progress <= 55) {

      setProgress(progress);

    }


    if (progress >= 55) {

      clearInterval(firstStage);


      status.textContent =
        "Almost ready";


      setTimeout(() => {

        /* DIRECT JUMP TO 90% */

        setProgress(90);

        status.textContent =
          "Finalizing";


        let finalProgress = 90;


        /* 90 → 100 SLOWLY */

        const finalStage =
          setInterval(() => {

            finalProgress += 1;

            setProgress(
              finalProgress
            );


            if (
              finalProgress >= 100
            ) {

              clearInterval(
                finalStage
              );

              finish();

            }

          }, 85);


      }, 300);

    }

  }, 95);

</script>
